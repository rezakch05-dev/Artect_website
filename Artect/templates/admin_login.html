<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیریت</title><style>:root{--p:{{palette.primary}};--ph:{{palette.primary_hover}};--bg:{{palette.background}};--surface:{{palette.surface}};--text:{{palette.text_primary}};--border:{{palette.border}}}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center}.login{width:min(430px,calc(100% - 32px));padding:30px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 70px #0007}.login h1{font-size:25px;text-align:center;margin:0 0 24px}.field{display:grid;gap:8px;margin-top:14px}.field label{font-size:13px}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}.btn{width:100%;margin-top:18px;padding:12px;border:1px solid var(--p);border-radius:9px;background:var(--p);color:#101410;font-weight:700;font:inherit;cursor:pointer}.flash{margin-bottom:14px;color:var(--p);font-size:13px;text-align:center} .password-wrap{position:relative}.password-wrap input{padding-left:42px}.password-toggle{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--text);cursor:pointer;font-size:15px}</style><script>function togglePassword(b){const i=b.parentElement.querySelector("input");i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"◉":"◉"}</script></head><body><main class="login"><h1>ورود به پنل مدیریت</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><div class="field"><label>نام کاربری</label><input name="username" autocomplete="username" required></div><div class="field"><label>رمز عبور</label><div class="password-wrap"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" onclick="togglePassword(this)" aria-label="نمایش رمز">◉</button></div></div><button class="btn">ورود</button></form></main></body></html>
