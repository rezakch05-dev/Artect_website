{% extends 'admin_layout.html' %}{% block admin_content %}<div class="section-head"><div><h1>تصاویر و آیکون‌ها</h1><p class="muted">تصاویر در پوشه images و SVGها در پوشه icons ذخیره می‌شوند.</p></div></div><form class="adminbox" method="post" enctype="multipart/form-data"><div class="formgrid"><div class="field"><label>نوع</label><select name="kind"><option value="image">تصویر</option><option value="icon">آیکون SVG</option></select></div><div class="field"><label>فایل</label><input type="file" name="file" required accept="image/*,.svg" multiple></div><div class="field full"><label>متن جایگزین تصویر</label><input name="alt_text"></div></div><button class="btn primary" style="margin-top:14px">آپلود</button></form><div class="section"><h2>کتابخانه</h2><div class="asset-grid">{% for a in media %}<div class="asset"><img class="{{'icon-clean' if a['kind']=='icon' else ''}}" src="{{('/images/' if a['kind']=='image' else '/icons/') ~ a['filename']}}" alt="{{a['alt_text']}}"><small>{{a['filename']}}</small><form method="post" action="/admin/media/{{a['id']}}/delete" onsubmit="return confirm('حذف شود؟')"><button class="btn danger" style="margin-top:6px;width:100%">حذف</button></form></div>{% else %}<p class="muted">هنوز فایلی ثبت نشده است.</p>{% endfor %}</div></div>{% endblock %}
