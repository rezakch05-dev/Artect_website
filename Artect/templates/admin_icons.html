{% extends 'admin_layout.html' %}{% block admin_content %}<div class="admin-head"><div><span class="eyebrow">رسانه</span><h1>آیکون‌ها</h1><p>آپلود و مدیریت SVGها کاملاً جدا از تصاویر است.</p></div></div><form class="upload-box" method="post" action="/admin/media/upload/icon" enctype="multipart/form-data"><h2>آپلود آیکون SVG</h2><input type="file" name="file" accept=".svg,image/svg+xml" required multiple><button class="btn primary">آپلود آیکون</button></form><div class="asset-library">{% for a in media %}<div class="asset-card icon-asset"><img class="icon-clean" src="/icons/{{a['filename']}}"><small>{{a['filename']}}</small><form method="post" action="/admin/media/{{a['id']}}/delete"><button class="btn danger">حذف</button></form></div>{% else %}<p>هنوز آیکونی آپلود نشده است.</p>{% endfor %}</div>{% endblock %}
