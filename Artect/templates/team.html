{% extends "layout.html" %}{% block content %}<main class="section container"><div class="section-head"><div><div class="eyebrow">تیم ما</div><h1>تیمی برای ساختن <span class="accent">تجربه‌های بهتر.</span></h1></div></div><div class="grid">{% for m in members %}<article class="card"><img src="{{('/images/' + m['image']) if m['image'] else '/static/images/placeholder-card.png'}}" alt="{{m['name']}}"><h3>{{m['name']}}</h3><div class="accent">{{m['role']}}</div><p class="muted">{{m['bio']}}</p></article>{% else %}<article class="card"><p>اعضای تیم را از پنل مدیریت اضافه کنید.</p></article>{% endfor %}</div></main>{% endblock %}
